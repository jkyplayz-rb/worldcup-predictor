<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
  <title>Register — World Cup Predictor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>* { font-family: 'Inter', sans-serif; }</style>
</head>

<body class="bg-[#0e0e0e] text-white min-h-screen flex flex-col">

  <header class="bg-[#141414] border-b border-[#1f1f1f] px-6 py-3 flex items-center">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 flex items-center justify-center text-blue-500">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
          <path fill-rule="evenodd" d="M5.166 2.621v.858c-1.035.148-2.059.33-3.071.543a.75.75 0 0 0-.584.859 6.753 6.753 0 0 0 6.138 5.6 6.73 6.73 0 0 0 2.743 1.346A6.707 6.707 0 0 1 9.279 15H8.54c-1.036 0-1.875.84-1.875 1.875V19.5h-.75a2.25 2.25 0 0 0-2.25 2.25c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-2.25-2.25h-.75v-2.625c0-1.036-.84-1.875-1.875-1.875h-.739a6.706 6.706 0 0 1-1.112-3.173 6.73 6.73 0 0 0 2.743-1.347 6.753 6.753 0 0 0 6.139-5.6.75.75 0 0 0-.585-.858 47.077 47.077 0 0 0-3.07-.543V2.62a.75.75 0 0 0-.658-.744 49.798 49.798 0 0 0-6.093-.377c-2.063 0-4.096.128-6.093.377a.75.75 0 0 0-.657.744Zm0 2.629c0 1.196.312 2.32.857 3.294A5.266 5.266 0 0 1 3.16 5.337a45.6 45.6 0 0 1 2.006-.343v.256Zm13.5 0v-.256c.674.1 1.343.214 2.006.343a5.265 5.265 0 0 1-2.863 3.207 6.72 6.72 0 0 0 .857-3.294Z" clip-rule="evenodd" />
        </svg>
      </div>
      <span class="font-semibold text-sm tracking-tight">World Cup Predictor</span>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm">

      <div class="mb-8 text-center">
        <div class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-lg font-black mx-auto mb-4">WC</div>
        <h1 class="text-xl font-bold mb-1">Create your account</h1>
        <p class="text-zinc-500 text-sm">Start predicting World Cup results</p>
      </div>

      {% for message in get_flashed_messages() %}
      <div class="bg-red-600/10 border border-red-600/20 rounded-xl px-4 py-3 mb-4 text-sm text-red-400">
        {{ message }}
      </div>
      {% endfor %}

      <form method="POST" class="flex flex-col gap-3">
        <div>
          <label class="text-[10px] font-semibold text-zinc-600 uppercase tracking-widest block mb-1.5">Username</label>
          <input type="text" name="username" placeholder="Choose a username" required
            class="w-full bg-[#141414] border border-[#2a2a2a] rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-blue-600 transition">
        </div>
        <div>
          <label class="text-[10px] font-semibold text-zinc-600 uppercase tracking-widest block mb-1.5">Password</label>
          <input type="password" name="password" placeholder="Choose a password" required
            class="w-full bg-[#141414] border border-[#2a2a2a] rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-blue-600 transition">
        </div>
        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-sm transition mt-1">
          Create account
        </button>
      </form>

      <p class="text-center text-zinc-600 text-xs mt-6">
        Already have an account?
        <a href="/login" class="text-blue-400 hover:text-blue-300 font-medium transition">Sign in</a>
      </p>

    </div>
  </main>

</body>
</html>
