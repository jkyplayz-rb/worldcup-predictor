<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leaderboard — World Cup Predictor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>⚽ World Cup Predictor</h1>
    <nav>
      <a href="/">Matches</a>
      <a href="/results">Results</a>
      <a href="/leaderboard">Leaderboard</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>
  <main>
    <h2 class="section-title">Leaderboard</h2>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody>
          {% for s in scores %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ s.username }}</td>
            <td>{{ s.points }} pts</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
